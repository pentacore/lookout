name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -c -tags integration -o checks.test ./internal/checks
      - run: sudo ./checks.test -test.run Integration -test.v

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: shellcheck -s sh packaging/install.sh
      - run: shellcheck packaging/unraid/rc.lookout packaging/unraid/supervise packaging/unraid/enroll packaging/unraid/plg-install.sh packaging/unraid/plg-remove.sh
      - run: shellcheck -x scripts/*.sh packaging/test/*.sh
      - run: php -l packaging/unraid/enroll.php && sed '1,/^---$/d' packaging/unraid/Lookout.page | php -l
      - run: sh packaging/test/install_test.sh
      - run: bash packaging/test/supervise_test.sh
      - run: bash packaging/test/unraid_test.sh
      - name: xmllint rendered lookout.plg
        run: |
          MINISIGN_PUBLIC_KEY=RWQci scripts/render-release-files.sh 0.0.0 build/ci-render
          xmllint --noout build/ci-render/lookout.plg
