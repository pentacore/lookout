name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # With cosign on PATH, goreleaser-action verifies the goreleaser download.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check the tag is vX.Y.Z or vX.Y.Z-prerelease
        run: |
          if ! [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          fi

      - name: Install minisign
        run: |
          go install aead.dev/minisign/cmd/minisign@v0.3.0
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - name: Write the signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "::error::secret MINISIGN_SECRET_KEY is not set"; exit 1; }
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$RUNNER_TEMP/minisign.key"
          chmod 0600 "$RUNNER_TEMP/minisign.key"
          echo "MINISIGN_KEY_FILE=$RUNNER_TEMP/minisign.key" >>"$GITHUB_ENV"

      - name: Check the public key variable is set
        run: test -n "$MINISIGN_PUBLIC_KEY" || { echo "::error::variable MINISIGN_PUBLIC_KEY is not set"; exit 1; }

      # Fails before anything is built or published when the secret key, its
      # password and the public key variable don't belong together.
      - name: Check the signing key matches the public key
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          printf 'lookout release key check %s\n' "$GITHUB_REF_NAME" >"$RUNNER_TEMP/sanity.txt"
          printf '%s\n' "$MINISIGN_PASSWORD" |
            minisign -S -s "$MINISIGN_KEY_FILE" -m "$RUNNER_TEMP/sanity.txt" -x "$RUNNER_TEMP/sanity.txt.minisig"
          minisign -V -P "$MINISIGN_PUBLIC_KEY" -m "$RUNNER_TEMP/sanity.txt" -x "$RUNNER_TEMP/sanity.txt.minisig"

      - name: Render install.sh and lookout.plg
        run: scripts/render-release-files.sh "${GITHUB_REF_NAME#v}" build/release-extra

      # Builds, signs and uploads a draft release (release.draft in
      # .goreleaser.yaml). Drafts are invisible to agents and install.sh.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          # Another tag on the same commit (such as an rc) must not be picked.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Remove the signing key
        if: always()
        run: rm -f "$MINISIGN_KEY_FILE"

      # The checks a running agent makes before it self-updates (signature,
      # exact trusted comment, embedded public key), on dist/ exactly as
      # uploaded. The draft stays unpublished if any of them fails.
      - name: Verify the archives
        run: scripts/verify-release-dist.sh dist "${GITHUB_REF_NAME#v}"

      # replace_existing_draft in .goreleaser.yaml keeps one draft per tag
      # across re-runs. Publishing by tag name must not pick one of several.
      - name: Check there is exactly one draft for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          drafts=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq "[.[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\")] | length" |
            awk '{ n += $1 } END { print n + 0 }')
          if [ "$drafts" -ne 1 ]; then
            echo "::error::found $drafts draft releases for $GITHUB_REF_NAME, want 1; delete the extra drafts on GitHub and re-run"
            exit 1
          fi

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
